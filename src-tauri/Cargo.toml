[package]
name = "chordlens"
version = "0.1.0"
description = "Local-first music transcription and chord analysis for macOS"
authors = ["ChordLens"]
edition = "2021"

[lib]
name = "chordlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
