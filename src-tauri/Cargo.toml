[package]
name = "chordlens"
version = "0.1.0"
description = "A local macOS chord tool: chord names, keys and guitar shapes in sync"
authors = ["ChordLens"]
license = "MIT"
edition = "2021"

[lib]
name = "chordlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
