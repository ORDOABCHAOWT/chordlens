name: Test and build macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install chromium
      - run: pnpm test:ui
      - run: pnpm test:visual
      - run: pnpm tauri build --bundles app
      - run: codesign --force --deep --sign - --options runtime --entitlements src-tauri/Entitlements.plist src-tauri/target/release/bundle/macos/ChordLens.app
      - run: codesign --verify --deep --strict src-tauri/target/release/bundle/macos/ChordLens.app
      - run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/ChordLens.app ChordLens.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChordLens-macOS
          path: ChordLens.zip
